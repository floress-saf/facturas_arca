{% extends "base.html" %}
{% block title %}{{ "Editar" if concepto else "Nuevo" }} Concepto{% endblock %}
{% block page_title %}{{ "Editar" if concepto else "Nuevo" }} Concepto{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-tag"></i> Datos del concepto</h3>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="form-group">
                        <label>Concepto</label>
                        <input type="text" class="form-control" name="concepto" value="{{ concepto.concepto if concepto else '' }}" required style="text-transform:uppercase;">
                    </div>
                    <hr>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                    <a href="/conceptos" class="btn btn-default ml-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
